name: Deploy Silo

# Deploy your sovereign Silo to YOUR server, straight from your fork — Kareya
# never touches it. Fork this repo, add the secrets below, then run this
# workflow (Actions tab → Deploy Silo → Run workflow).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST         your server's IP or hostname
#   SSH_USER         an SSH user with sudo (or root)
#   SSH_PRIVATE_KEY  a private key authorized on that server
#
# Optional feature secrets (leave unset to keep the .env defaults):
#   OPENAI_API_KEY, HUB_URL, HUB_ANON_KEY, HUB_PUBLISHABLE_KEY, HUB_SILO_API_KEY
#
# Your server needs: a public IP, ports 80 + 443 open, and DNS for the domain
# you enter below pointing at it. It runs install.sh from THIS fork.
#
# After it succeeds, register the Silo on the Kareya Hub (a `user_silos` row
# with the domain + the ANON_KEY from docker/.env) — see
# docs/Deploy-from-GitHub.md.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Public domain for the Silo (DNS A record → your server)"
        required: true
      email:
        description: "Email for Let's Encrypt certificate notices"
        required: true

concurrency:
  group: deploy-silo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DOMAIN: ${{ inputs.domain }}
          EMAIL: ${{ inputs.email }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_ANON_KEY: ${{ secrets.HUB_ANON_KEY }}
          HUB_PUBLISHABLE_KEY: ${{ secrets.HUB_PUBLISHABLE_KEY }}
          HUB_SILO_API_KEY: ${{ secrets.HUB_SILO_API_KEY }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ -n "$SSH_HOST" ]        || { echo "::error::Missing secret SSH_HOST"; exit 1; }
          [ -n "$SSH_USER" ]        || { echo "::error::Missing secret SSH_USER"; exit 1; }
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "::error::Missing secret SSH_PRIVATE_KEY"; exit 1; }

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "Deploying $REPO@$BRANCH to $SSH_USER@$SSH_HOST for $DOMAIN"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            "curl -fsSL 'https://raw.githubusercontent.com/${REPO}/${BRANCH}/install.sh' -o /tmp/kareya-install.sh \
             && sudo OPENAI_API_KEY='${OPENAI_API_KEY}' HUB_URL='${HUB_URL}' HUB_ANON_KEY='${HUB_ANON_KEY}' \
                  HUB_PUBLISHABLE_KEY='${HUB_PUBLISHABLE_KEY}' HUB_SILO_API_KEY='${HUB_SILO_API_KEY}' \
                  bash /tmp/kareya-install.sh --domain '${DOMAIN}' --email '${EMAIL}' --repo '${REPO}' --branch '${BRANCH}'"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Kareya Silo deploy"
            echo ""
            echo "- **Domain:** ${{ inputs.domain }}"
            echo "- **Source:** \`${{ github.repository }}@${{ github.ref_name }}\`"
            echo ""
            echo "If it succeeded, watch it come up on your server:"
            echo '```'
            echo "cd /opt/kareya-silo/docker && docker compose logs -f"
            echo '```'
            echo "Then register it on the Kareya Hub (a \`user_silos\` row) using your domain + the ANON_KEY in \`docker/.env\`."
          } >> "$GITHUB_STEP_SUMMARY"
